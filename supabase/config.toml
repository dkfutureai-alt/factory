project_id = "factoryos-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_phase5.sql", "./seed_phase6.sql", "./seed_phase7.sql", "./seed_phase8.sql", "./seed_phase9.sql", "./seed_phase10.sql", "./seed_phase11.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.invite-user]
verify_jwt = true

[functions.send-notifications]
verify_jwt = false
