name: Mobile Release Foundation

on:
  push:
    branches:
      - work/phase16-production-release
    paths:
      - '.github/workflows/mobile-release-foundation.yml'

permissions:
  contents: write

jobs:
  generate-platform-shells:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/phase16-production-release
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS shells from Flutter stable
        working-directory: apps/mobile
        run: |
          flutter create . \
            --platforms=android,ios \
            --org=com.dkappsstudio \
            --project-name=factoryos_mobile
          flutter pub get
      - name: Apply FactoryOS production identifiers
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'com.dkappsstudio.factoryos_mobile'
          new = 'com.dkappsstudio.factoryos'
          for root in (Path('android'), Path('ios')):
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      path.write_text(text.replace(old, new))

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="factoryos_mobile"', 'android:label="FactoryOS"')
          manifest.write_text(text)

          info = Path('ios/Runner/Info.plist')
          text = info.read_text().replace('<string>factoryos_mobile</string>', '<string>FactoryOS</string>')
          info.write_text(text)

          old_main = Path('android/app/src/main/kotlin/com/dkappsstudio/factoryos_mobile/MainActivity.kt')
          if old_main.exists():
              new_main = Path('android/app/src/main/kotlin/com/dkappsstudio/factoryos/MainActivity.kt')
              new_main.parent.mkdir(parents=True, exist_ok=True)
              new_main.write_text(old_main.read_text().replace(old, new))
              old_main.unlink()
              parent = old_main.parent
              while parent != Path('android/app/src/main/kotlin'):
                  try:
                      parent.rmdir()
                  except OSError:
                      break
                  parent = parent.parent
          PY
      - name: Verify generated identifiers
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build.gradle.kts
          test -f ios/Runner.xcodeproj/project.pbxproj
          grep -R "com.dkappsstudio.factoryos" android/app ios/Runner.xcodeproj >/dev/null
          if grep -R "com.dkappsstudio.factoryos_mobile" android/app ios/Runner.xcodeproj; then
            echo 'Old generated application identifier remains.'
            exit 1
          fi
      - name: Commit generated release foundation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo 'Platform shells are already generated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile
          git commit -m 'Phase 16: add generated Android/iOS release shells [mobile-shell-generated]'
          git push origin HEAD:work/phase16-production-release
