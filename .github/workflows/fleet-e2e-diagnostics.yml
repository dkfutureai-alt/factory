name: Fleet E2E Diagnostics Patch

# One-shot branch patcher; remove after it commits the test diagnostics.
on:
  push:
    branches: [phase9-fleet-backend]
    paths: ['.github/workflows/fleet-e2e-diagnostics.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9-fleet-backend
      - name: Make Fleet lifecycle RPC failures explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/tests/fleet_auth_e2e.sh')
          s = p.read_text()
          s = s.replace('rpc "$DRIVER_TOKEN" fleet_start_trip', 'rpc_checked "$DRIVER_TOKEN" fleet_start_trip')
          s = s.replace('FUEL_ID="$(rpc "$DRIVER_TOKEN" fleet_record_fuel', 'FUEL_ID="$(rpc_checked "$DRIVER_TOKEN" fleet_record_fuel')
          s = s.replace('rpc "$DRIVER_TOKEN" fleet_mark_trip_arrived', 'rpc_checked "$DRIVER_TOKEN" fleet_mark_trip_arrived')
          s = s.replace('rpc "$DRIVER_TOKEN" fleet_complete_trip', 'rpc_checked "$DRIVER_TOKEN" fleet_complete_trip')
          p.write_text(s)
          PY
      - name: Commit diagnostic patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/fleet_auth_e2e.sh
          git commit -m 'test: expose Fleet lifecycle RPC errors'
          git push origin HEAD:phase9-fleet-backend
