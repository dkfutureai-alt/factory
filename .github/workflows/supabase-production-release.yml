name: Supabase Production Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to apply production migrations and deploy functions'
        required: true
        default: 'REVIEW'
      confirm_project_ref:
        description: 'Independently type the exact FactoryOS production Supabase project ref'
        required: true
        default: ''
      approved_plan_run_id:
        description: 'Successful reviewed Supabase Production Plan run ID for this exact main commit (max 24 hours old)'
        required: true
        default: ''
      release_scope:
        description: 'Database schema first, or schema plus configured Edge Functions'
        required: true
        type: choice
        options:
          - database-only
          - full
        default: database-only

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: factoryos-production
    env:
      CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
      RELEASE_SCOPE: ${{ inputs.release_scope }}
      FACTORYOS_SUPABASE_URL: ${{ secrets.FACTORYOS_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.FACTORYOS_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.FACTORYOS_SUPABASE_DB_PASSWORD }}
      FACTORYOS_INVITE_REDIRECT_URL: ${{ secrets.FACTORYOS_INVITE_REDIRECT_URL }}
      NOTIFICATION_DISPATCH_SECRET: ${{ secrets.NOTIFICATION_DISPATCH_SECRET }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
      FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject duplicate or malformed migration versions before linking
        run: python3 scripts/check_migration_versions.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Validate production release secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_PROJECT_REF
            SUPABASE_DB_PASSWORD
            FACTORYOS_SUPABASE_URL
          )
          if [[ "$RELEASE_SCOPE" == 'full' ]]; then
            required+=(
              FACTORYOS_INVITE_REDIRECT_URL
              NOTIFICATION_DISPATCH_SECRET
              FCM_PROJECT_ID
              FCM_CLIENT_EMAIL
              FCM_PRIVATE_KEY
            )
          fi
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || \
             [[ "$SUPABASE_PROJECT_REF" != "zevrmvhnibztbxizswgu" ]] || \
             [[ "$CONFIRMED_PROJECT_REF" != "$SUPABASE_PROJECT_REF" ]] || \
             [[ "${FACTORYOS_SUPABASE_URL%/}" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]]; then
            echo 'Production project confirmation or URL mismatch; refusing to deploy.'
            exit 1
          fi
          if [[ "$RELEASE_SCOPE" == 'full' ]]; then
            [[ "$FACTORYOS_INVITE_REDIRECT_URL" == https://* ]]
          fi
          # Never use the GitHub release workflow to seed production data.
          test -f supabase/migrations/0044_customer_pilot_testing.sql
          test -f supabase/migrations/0047_gas_container_serial_registry.sql
          test -f supabase/migrations/0048_gas_serial_transaction_links.sql
          test -f supabase/migrations/0049_gas_serial_attestation_coverage.sql
      - name: Verify approved, successful, same-commit migration plan run
        env:
          APPROVED_PLAN_RUN_ID: ${{ inputs.approved_plan_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_release_plan.py
      - name: Link exact FactoryOS production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Check linked migration history before any writes
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee /tmp/factoryos-migrations-before.txt
          python3 scripts/verify_production_migrations.py --stage preflight --input /tmp/factoryos-migrations-before.txt
      - name: Preview pending production migrations
        run: supabase db push --dry-run
      - name: Apply pending production migrations
        run: supabase db push
      - name: Verify all committed migrations reached exact FactoryOS project
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee /tmp/factoryos-migrations-after.txt
          python3 scripts/verify_production_migrations.py --stage postdeploy --input /tmp/factoryos-migrations-after.txt
      - name: Configure Edge Function production secrets
        if: inputs.release_scope == 'full'
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            "FACTORYOS_INVITE_REDIRECT_URL=$FACTORYOS_INVITE_REDIRECT_URL" \
            "NOTIFICATION_DISPATCH_SECRET=$NOTIFICATION_DISPATCH_SECRET" \
            "FCM_PROJECT_ID=$FCM_PROJECT_ID" \
            "FCM_CLIENT_EMAIL=$FCM_CLIENT_EMAIL" \
            "FCM_PRIVATE_KEY=$FCM_PRIVATE_KEY"
      - name: Deploy FactoryOS Edge Functions
        if: inputs.release_scope == 'full'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
