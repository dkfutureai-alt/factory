name: Android Production Bundle

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BUILD to create a signed production AAB'
        required: true
        default: 'REVIEW'

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.confirm == 'BUILD' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.FACTORYOS_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FACTORYOS_SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_API_KEY: ${{ secrets.FACTORYOS_FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FACTORYOS_FIREBASE_ANDROID_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FACTORYOS_FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FACTORYOS_FIREBASE_STORAGE_BUCKET }}
      FACTORYOS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FACTORYOS_ANDROID_KEYSTORE_PASSWORD }}
      FACTORYOS_ANDROID_KEY_ALIAS: ${{ secrets.FACTORYOS_ANDROID_KEY_ALIAS }}
      FACTORYOS_ANDROID_KEY_PASSWORD: ${{ secrets.FACTORYOS_ANDROID_KEY_PASSWORD }}
      FACTORYOS_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate production mobile configuration
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FACTORYOS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            SUPABASE_URL
            SUPABASE_PUBLISHABLE_KEY
            FIREBASE_API_KEY
            FIREBASE_APP_ID
            FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_PROJECT_ID
            FACTORYOS_ANDROID_KEYSTORE_PASSWORD
            FACTORYOS_ANDROID_KEY_ALIAS
            FACTORYOS_ANDROID_KEY_PASSWORD
            KEYSTORE_BASE64
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Android production secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
      - name: Restore Android release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FACTORYOS_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/factoryos-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          echo "FACTORYOS_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build signed production AAB
        working-directory: apps/mobile
        run: >-
          flutter build appbundle --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
          --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
          --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID"
          --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
      - name: Verify production bundle
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          bundle='build/app/outputs/bundle/release/app-release.aab'
          test -f "$bundle"
          sha256sum "$bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: factoryos-android-production-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
