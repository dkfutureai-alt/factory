name: Supabase Foundation Checks

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-foundation.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-foundation.yml'

concurrency:
  group: supabase-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check invitation Edge Function
        run: deno check supabase/functions/invite-user/index.ts
      - name: Start local Supabase
        run: supabase start
      - name: Reset and apply migrations + seed
        run: supabase db reset
      - name: Run SQL smoke checks
        run: |
          set -euo pipefail
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
              -v ON_ERROR_STOP=1 \
              -f "${test_file}"
          done
      - name: Run real Auth and RLS flow
        run: bash supabase/tests/auth_login_e2e.sh
