# Phase 15 final-head validation marker.
name: Supabase Foundation Checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/supabase-foundation.yml'
      - '.github/workflows/supabase-production-release.yml'

concurrency:
  group: supabase-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse accidental tracked production backup exports
        run: python3 scripts/check_no_private_backups.py
      - name: Reject duplicate or malformed migration versions before database startup
        run: python3 scripts/check_migration_versions.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check invitation Edge Function
        run: deno check supabase/functions/invite-user/index.ts
      - name: Test invitation input and redirect handling
        run: deno test supabase/functions/invite-user/invite_helpers_test.ts
      - name: Check notification delivery Edge Function
        run: deno check supabase/functions/send-notifications/index.ts
      - name: Test notification worker response handling
        run: deno test supabase/functions/send-notifications/worker_helpers_test.ts
      - name: Start local Supabase
        run: supabase start
      - name: Reset and apply migrations + seed
        run: supabase db reset
      - name: Lint public database functions
        run: supabase db lint --level error -s public
      - name: Run SQL smoke checks
        run: |
          set -euo pipefail
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' \
              -v ON_ERROR_STOP=1 \
              -f "${test_file}"
          done
      - name: Run real Auth, RLS, inventory, production, quality, purchase, sales, warehouse, fleet, dispatch, maintenance, reports, notifications and security flows
        run: |
          set -euo pipefail
          source supabase/tests/auth_login_e2e.sh
          source supabase/tests/inventory_auth_e2e.sh
          source supabase/tests/gas_asset_auth_e2e.sh
          source supabase/tests/gas_asset_transaction_auth_e2e.sh
          bash supabase/tests/production_auth_e2e.sh
          bash supabase/tests/quality_auth_e2e.sh
          bash supabase/tests/purchase_sales_auth_e2e.sh
          bash supabase/tests/warehouse_auth_e2e.sh
          bash supabase/tests/fleet_auth_e2e.sh
          bash supabase/tests/dispatch_auth_e2e.sh
          bash supabase/tests/maintenance_auth_e2e.sh
          bash supabase/tests/reports_auth_e2e.sh
          bash supabase/tests/notifications_auth_e2e.sh
          bash supabase/tests/notifications_scope_e2e.sh
          bash supabase/tests/security_auth_e2e.sh
          bash supabase/tests/pilot_auth_e2e.sh
