name: Phase 7 Navigation Connect

on:
  push:
    paths:
      - '.github/workflows/phase7-navigation-connect.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Phase 7 admin analyzer issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/admin_web/lib/purchase_sales_management.dart')
          text = path.read_text()
          old = 'Wrap(mainAxisSize: MainAxisSize.min, children:'
          assert text.count(old) == 3, text.count(old)
          text = text.replace(old, 'Row(mainAxisSize: MainAxisSize.min, children:')
          old = 'separatorBuilder: (_, __) =>'
          assert old in text
          text = text.replace(old, 'separatorBuilder: (_, _) =>', 1)
          path.write_text(text)
          PY
      - name: Commit analyzer fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin_web/lib/purchase_sales_management.dart
          git commit -m 'fix: clean Phase 7 admin analysis'
          git push origin HEAD:main
