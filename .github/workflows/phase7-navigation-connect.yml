name: Phase 7 Navigation Connect

on:
  push:
    paths:
      - '.github/workflows/phase7-navigation-connect.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden Phase 7 admin code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/admin_web/lib/purchase_sales_management.dart')
          text = path.read_text()
          old = "locationId=(preferred.isNotEmpty?preferred.first:widget.locations.firstOrNull)?['id'] as String?;"
          new = "if(preferred.isNotEmpty){locationId=preferred.first['id'] as String;}else if(widget.locations.isNotEmpty){locationId=widget.locations.first['id'] as String;}"
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit hardening fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin_web/lib/purchase_sales_management.dart
          git commit -m 'fix: harden Phase 7 receipt location selection'
          git push origin HEAD:main
