name: Mobile Release Quality

on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'packages/factoryos_core/**'
      - '.github/workflows/mobile-release-quality.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/factoryos_core/**'
      - '.github/workflows/mobile-release-quality.yml'

concurrency:
  group: mobile-release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build Android release bundle
        working-directory: apps/mobile
        run: >-
          flutter build appbundle --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=placeholder
      - name: Verify Android release artifact
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          bundle='build/app/outputs/bundle/release/app-release.aab'
          test -f "$bundle"
          bytes=$(stat -c%s "$bundle")
          echo "Android AAB bytes: $bytes"
          test "$bytes" -le 104857600

      - name: Build isolated offline Android QA preview
        working-directory: apps/mobile
        env:
          FACTORYOS_QA_PREVIEW_BUILD: 'true'
        run: >-
          flutter build apk --debug
          --target lib/qa_preview.dart
          --dart-define=FACTORYOS_QA_PREVIEW=true
      - name: Verify offline QA APK identity and checksum
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          test -s "$apk"
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | grep -Fq "package: name='com.dkappsstudio.factoryos.qapreview'"
          (cd build/app/outputs/flutter-apk && sha256sum app-debug.apk > QA_PREVIEW_SHA256.txt)
          echo 'Offline QA preview: fixture data only, no Supabase or Firebase.'
          echo 'Not a signed store release. Does not test live backend workflows.'
      - name: Save installable Android UI-only QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FACTORYOS-OFFLINE-UI-PREVIEW-NOT-FOR-STORE
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/QA_PREVIEW_SHA256.txt
          if-no-files-found: error
          retention-days: 7

  ios-release-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Build iOS release without signing
        working-directory: apps/mobile
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=placeholder
      - name: Verify iOS release app
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
