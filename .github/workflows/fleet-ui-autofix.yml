name: Fleet UI Autofix

# One-shot formatter/lint fixer for the Phase 9 Fleet UI branch.
on:
  push:
    branches:
      - phase9-fleet-backend
    paths:
      - '.github/workflows/fleet-ui-autofix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase9-fleet-backend
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix Admin lints
        working-directory: apps/admin_web
        run: |
          flutter pub get
          dart fix --apply
          dart format lib
      - name: Fix Mobile lints
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart fix --apply
          dart format lib
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/admin_web apps/mobile
          if git diff --cached --quiet; then
            echo 'No autofixes needed.'
            exit 0
          fi
          git commit -m 'fix: apply Fleet UI lint fixes'
          git push origin HEAD:phase9-fleet-backend
