name: Production Smoke Verification

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY to run authenticated production smoke checks'
        required: true
        default: 'REVIEW'
      confirm_project_ref:
        description: 'Independently type the exact FactoryOS production Supabase project ref'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ inputs.confirm == 'VERIFY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: factoryos-production
    env:
      SUPABASE_URL: ${{ secrets.FACTORYOS_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.FACTORYOS_SUPABASE_PUBLISHABLE_KEY }}
      SMOKE_EMAIL: ${{ secrets.FACTORYOS_SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.FACTORYOS_SMOKE_PASSWORD }}
      ADMIN_URL: ${{ secrets.FACTORYOS_ADMIN_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.FACTORYOS_SUPABASE_PROJECT_REF }}
      CONFIRMED_PROJECT_REF: ${{ inputs.confirm_project_ref }}
    steps:
      - name: Validate smoke configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SMOKE_EMAIL SMOKE_PASSWORD SUPABASE_PROJECT_REF)
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production smoke secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]] || \
             [[ "$SUPABASE_PROJECT_REF" != "zevrmvhnibztbxizswgu" ]] || \
             [[ "$CONFIRMED_PROJECT_REF" != "$SUPABASE_PROJECT_REF" ]] || \
             [[ "${SUPABASE_URL%/}" != "https://${SUPABASE_PROJECT_REF}.supabase.co" ]]; then
            echo 'Production smoke target mismatch; refusing to authenticate.'
            exit 1
          fi

      - name: Verify Supabase REST endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            >/dev/null

      - name: Sign in production smoke user
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg email "$SMOKE_EMAIL" --arg password "$SMOKE_PASSWORD" '{email:$email,password:$password}')
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data "$payload")
          token=$(jq -r '.access_token // empty' <<<"$response")
          test -n "$token"
          echo "::add-mask::$token"
          echo "access_token=$token" >> "$GITHUB_OUTPUT"

      - name: Verify authenticated identity and tenant RLS
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          user=$(curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/auth/v1/user" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $ACCESS_TOKEN")
          test -n "$(jq -r '.id // empty' <<<"$user")"

          user_id=$(jq -r '.id' <<<"$user")
          memberships=$(curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/organization_members?select=organization_id,user_id,role&user_id=eq.${user_id}&is_active=eq.true&limit=5" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $ACCESS_TOKEN")
          jq -e --arg uid "$user_id" 'type == "array" and length == 1 and all(.[]; (.organization_id | type == "string") and (.role | type == "string") and .user_id == $uid)' \
            <<<"$memberships" >/dev/null

          factories=$(curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/rest/v1/factories?select=id,name,code&is_active=eq.true&limit=5" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $ACCESS_TOKEN")
          jq -e 'type == "array"' <<<"$factories" >/dev/null
          echo "Authenticated production Auth + RLS smoke passed."

      - name: Verify Phase 20 returnable-intake API permissions (read-only)
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          # Both tables must be accessible as the authenticated, least-
          # privilege smoke member. RLS may return [], which is expected.
          # No rows are inserted or modified by these probes.
          for table in dispatch_returnable_intakes dispatch_returnable_intake_lines; do
            rows=$(curl --fail-with-body --silent --show-error \
              "$SUPABASE_URL/rest/v1/${table}?select=id&limit=1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "Authorization: Bearer $ACCESS_TOKEN")
            jq -e 'type == "array"' <<<"$rows" >/dev/null

            # Do not accept anonymous reads even when the table is empty.
            anon_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "$SUPABASE_URL/rest/v1/${table}?select=id&limit=1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY")
            if [[ "$anon_status" != 4* ]]; then
              echo "Anonymous ${table} access was not explicitly denied (expected 4xx)." >&2
              exit 1
            fi
          done
          echo 'FactoryOS returnable intake API grants and anonymous denial verified.'

      - name: Verify Phase 17 customer-pilot API access (read-only)
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          # Test only read grants and the absence of anonymous access. Do not
          # create or edit participants, feedback, customer data or approvals.
          for table in pilot_participants pilot_feedback; do
            response=$(curl --fail-with-body --silent --show-error \
              --max-time 20 \
              "$SUPABASE_URL/rest/v1/${table}?select=organization_id,user_id&limit=1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "Authorization: Bearer $ACCESS_TOKEN")
            jq -e 'type == "array"' <<<"$response" >/dev/null

            # The schema must not be accessible by a publishable-key request
            # without an authenticated user JWT, even when the table is empty.
            anonymous_status=$(curl --silent --show-error \
              --max-time 20 --output /dev/null --write-out '%{http_code}' \
              "$SUPABASE_URL/rest/v1/${table}?select=organization_id,user_id&limit=1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY")
            if [[ "$anonymous_status" == 2* ]]; then
              echo "Anonymous customer-pilot API access unexpectedly succeeded: $table" >&2
              exit 1
            fi
            if [[ "$anonymous_status" != 4* ]]; then
              echo "Customer-pilot anonymous denial returned unexpected HTTP status for $table." >&2
              exit 1
            fi
          done
          echo 'FactoryOS pilot API read grants and anonymous denial passed; no data changed.'

      - name: Verify Phase 21A/21B serial registry and transaction evidence API (read-only)
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          # Read only: no registration, inspection, mutation or test customer.
          # A successful empty [] is valid, but anonymous API reads are not.
          for table in gas_container_assets gas_container_asset_events gas_container_transaction_links; do
            data=$(curl --fail-with-body --silent --show-error --max-time 20 \
              "$SUPABASE_URL/rest/v1/${table}?select=id,organization_id&limit=1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              --header "Authorization: Bearer $ACCESS_TOKEN")
            jq -e 'type == "array"' <<<"$data" >/dev/null

            anon_status=$(curl --silent --show-error --max-time 20 \
              --output /dev/null --write-out '%{http_code}' \
              "$SUPABASE_URL/rest/v1/${table}?select=id&limit=1" \
              --header "apikey: $SUPABASE_PUBLISHABLE_KEY")
            if [[ "$anon_status" != 4* ]]; then
              echo "Gas registry $table anonymous access not denied (expected 4xx)." >&2
              exit 1
            fi
          done
          echo 'Serialized gas registry and transaction evidence API read permissions passed; no data changed.'

      - name: Verify Phase 21C serial coverage RPC access (read-only)
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          uid_json=$(curl --fail-with-body --silent --show-error --max-time 20 \
            "$SUPABASE_URL/auth/v1/user" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          user_id=$(jq -r '.id // empty' <<<"$uid_json")
          test -n "$user_id"
          memberships=$(curl --fail-with-body --silent --show-error --max-time 20 \
            "$SUPABASE_URL/rest/v1/organization_members?select=organization_id&user_id=eq.${user_id}&is_active=eq.true&limit=2" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN")
          # Fail closed instead of selecting the first of several active workspaces.
          jq -e 'type == "array" and length == 1 and (.[0].organization_id | type == "string")' \
            <<<"$memberships" >/dev/null
          org_id=$(jq -r '.[0].organization_id' <<<"$memberships")
          test -n "$org_id"
          payload=$(jq -nc --arg organization "$org_id" \
            '{p_organization_id:$organization,p_factory_id:null,p_limit:1}')
          response=$(curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/gas_serial_attestation_coverage" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' --data "$payload")
          jq -e 'type=="array"' <<<"$response" >/dev/null

          anon_status=$(curl --silent --show-error --max-time 20 \
            -o /dev/null -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/gas_serial_attestation_coverage" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' --data "$payload")
          if [[ "$anon_status" != 4* ]]; then
            echo 'Anonymous cylinder serial coverage RPC was not denied (expected 4xx).' >&2
            exit 1
          fi
          echo 'Phase 21C authenticated coverage and anonymous denial passed; no data changed.'

      - name: Verify Admin portal when configured
        if: ${{ env.ADMIN_URL != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location "$ADMIN_URL" >/dev/null
          echo "Admin production URL responded successfully."
