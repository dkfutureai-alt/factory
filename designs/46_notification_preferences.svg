<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#F6F8FB"/><text x="20" y="42" font-family="Arial" font-size="22" font-weight="700" fill="#101828">Notification preferences</text><text x="20" y="68" font-family="Arial" font-size="12" fill="#667085">Choose non-critical alerts. Safety alerts stay enabled.</text><g font-family="Arial"><rect x="20" y="96" width="350" height="92" rx="12" fill="white" stroke="#E4E9F1"/><text x="38" y="128" font-size="14" font-weight="700" fill="#101828">Critical safety & breakdown</text><text x="38" y="151" font-size="12" fill="#667085">Mandatory in-app + push</text><text x="318" y="140" font-size="12" fill="#168A50">ON</text><rect x="20" y="200" width="350" height="92" rx="12" fill="white" stroke="#E4E9F1"/><text x="38" y="232" font-size="14" font-weight="700" fill="#101828">Assigned work updates</text><text x="38" y="255" font-size="12" fill="#667085">Production, trip, delivery, maintenance</text><text x="318" y="244" font-size="12" fill="#168A50">ON</text><rect x="20" y="304" width="350" height="92" rx="12" fill="white" stroke="#E4E9F1"/><text x="38" y="336" font-size="14" font-weight="700" fill="#101828">HR & leave</text><text x="38" y="359" font-size="12" fill="#667085">Approvals, holidays, attendance corrections</text><text x="318" y="348" font-size="12" fill="#168A50">ON</text><rect x="20" y="408" width="350" height="92" rx="12" fill="white" stroke="#E4E9F1"/><text x="38" y="440" font-size="14" font-weight="700" fill="#101828">Daily summary</text><text x="38" y="463" font-size="12" fill="#667085">One operational summary per day</text><text x="318" y="452" font-size="12" fill="#667085">OFF</text><rect x="20" y="528" width="350" height="126" rx="12" fill="white" stroke="#E4E9F1"/><text x="38" y="560" font-size="14" font-weight="700" fill="#101828">Quiet hours</text><text x="38" y="584" font-size="12" fill="#667085">10:00 PM – 06:00 AM</text><text x="38" y="616" font-size="11" fill="#B7791F">Critical alerts ignore quiet hours</text></g></svg>