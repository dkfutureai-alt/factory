<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024"><rect width="1440" height="1024" fill="#F6F8FB"/><rect width="236" height="1024" fill="#162033"/><text x="32" y="52" font-family="Arial" font-size="24" font-weight="700" fill="white">FACTORYOS</text><g font-family="Arial"><text x="264" y="54" font-size="26" font-weight="700" fill="#101828">Delivery Exception / Return</text><text x="264" y="80" font-size="14" fill="#667085">DEL-2026-00678 • Apex Process Systems • Customer rejection</text><rect x="1110" y="34" width="208" height="42" rx="10" fill="#1457D9"/><text x="1140" y="60" font-size="14" font-weight="700" fill="white">Create return movement</text><rect x="264" y="116" width="1054" height="144" rx="14" fill="white" stroke="#E4E9F1"/><text x="288" y="154" font-size="13" fill="#667085">Exception type</text><text x="288" y="188" font-size="20" font-weight="700" fill="#D92D20">Partial rejection</text><text x="548" y="154" font-size="13" fill="#667085">Rejected quantity</text><text x="548" y="188" font-size="20" font-weight="700" fill="#101828">8 units</text><text x="806" y="154" font-size="13" fill="#667085">Return trip</text><text x="806" y="188" font-size="20" font-weight="700" fill="#B54708">Not created</text><text x="1064" y="154" font-size="13" fill="#667085">Resolution</text><text x="1064" y="188" font-size="20" font-weight="700" fill="#B54708">Pending</text><rect x="264" y="286" width="654" height="400" rx="14" fill="white" stroke="#E4E9F1"/><text x="288" y="326" font-size="18" font-weight="700" fill="#101828">Rejected items</text><text x="288" y="360" font-size="13" fill="#667085">Item • Delivered • Accepted • Rejected • Reason</text><text x="288" y="414" font-size="14" font-weight="700" fill="#101828">FG-VALVE-25</text><text x="470" y="414" font-size="14" fill="#101828">40</text><text x="580" y="414" font-size="14" fill="#027A48">32</text><text x="690" y="414" font-size="14" fill="#D92D20">8</text><text x="770" y="414" font-size="14" fill="#667085">Packaging damage</text><text x="288" y="472" font-size="13" fill="#667085">Customer note</text><text x="288" y="504" font-size="14" fill="#101828">Eight cartons damaged during unloading; return requested.</text><text x="288" y="558" font-size="13" fill="#667085">Evidence</text><text x="288" y="590" font-size="14" fill="#101828">2 photos • Receiver confirmation captured</text><rect x="944" y="286" width="374" height="400" rx="14" fill="white" stroke="#E4E9F1"/><text x="968" y="326" font-size="18" font-weight="700" fill="#101828">Resolution workflow</text><text x="968" y="374" font-size="14" font-weight="700" fill="#027A48">1. Delivery exception recorded</text><text x="968" y="414" font-size="14" font-weight="700" fill="#1457D9">2. Supervisor review</text><text x="968" y="454" font-size="14" fill="#667085">3. Return trip / pickup</text><text x="968" y="494" font-size="14" fill="#667085">4. Warehouse return receipt</text><text x="968" y="534" font-size="14" fill="#667085">5. Sales resolution / replacement</text><rect x="968" y="580" width="158" height="42" rx="10" fill="#E7EEFF"/><text x="995" y="606" font-size="14" font-weight="700" fill="#1457D9">Approve return</text><rect x="264" y="710" width="1054" height="160" rx="14" fill="white" stroke="#E4E9F1"/><text x="288" y="750" font-size="18" font-weight="700" fill="#101828">Inventory handoff rule</text><text x="288" y="788" font-size="14" fill="#667085">Rejected goods do not increase warehouse stock here. Approved physical receipt must create a posted customer_return inventory ledger transaction.</text><text x="288" y="828" font-size="14" fill="#667085">Replacement/credit decisions remain in Sales; transport pickup remains in Fleet/Trip.</text></g></svg>